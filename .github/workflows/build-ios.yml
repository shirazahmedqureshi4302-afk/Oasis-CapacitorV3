name: Build unsigned iOS IPA

# Run manually from the Actions tab, or automatically on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Free, unlimited on public repos — this is the "Mac" doing the compiling.
    runs-on: macos-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Add the iOS platform (first run only)
        run: test -d ios || npx cap add ios

      - name: Register the oasisledger:// URL scheme (for Shortcuts quick-add)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string oasisledger" "$PLIST"

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into an .ipa
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../OasisLedger-unsigned.ipa Payload

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: OasisLedger-unsigned-ipa
          path: OasisLedger-unsigned.ipa
