<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oasis Ledger">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fafaff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Oasis Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 336 280'%3E%3Ccircle cx='97' cy='114' r='63' fill='%23222'/%3E%3Cpath d='M157 92C192 62 228 42 260 47c29 5 45 35 45 73 0 38-13 75-33 100-23 29-58 45-92 41-34-4-62-27-73-56-7-18-9-26-9-27' stroke='%23222' stroke-width='16' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#fafaff;--card:#fff;--line:#eaeaf3;--line2:#f3f3fa;--hover:#f6f6fd;--sel:#edecf9;
--ink:#0f1115;--ink2:#3a3f48;--muted:#767c86;--faint:#a4a9b2;
--accent:#4f46e5;--accent2:#eef0ff;--accent3:#c5c8f8;--warm:#dcdefb;
--tint:linear-gradient(175deg,#eef0ff 0%,#fff 58%);
--wash:radial-gradient(900px 300px at 12% -60px,#e4e6ff 0%,transparent 70%);
--green:#0f9d58;--greenbg:#e7f6ed;--red:#dc4b50;--redbg:#fdecec;
--violet:#7c5cfc;--amber:#e39b2c;--teal:#12a5a5;
--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
--serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
--r:16px;--sh:0 1px 2px rgba(16,18,22,.04);
}

/* ---------- typefaces ---------- */
[data-font="classic"]{--sans:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
 --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}
[data-font="times"]{--sans:'Times New Roman',Times,'Liberation Serif',serif;
 --serif:'Times New Roman',Times,'Liberation Serif',serif}
[data-font="editorial"] h1,[data-font="editorial"] h2,[data-font="editorial"] h3,
[data-font="editorial"] .h1,[data-font="editorial"] .big,[data-font="editorial"] .kpi .v{
 font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;letter-spacing:-.01em}
[data-font="classic"] .lbl,[data-font="times"] .lbl{font-family:var(--mono)}
[data-font="classic"] body,[data-font="times"] body{letter-spacing:0}
[data-font="times"]{font-size:14.5px}
/* ---------- themes ---------- */
[data-theme="aurora"]{--bg:#fbfaff;--line:#eceaf4;--line2:#f4f2fa;--hover:#f7f5fd;--sel:#efecfa;
 --accent:#7c5cfc;--accent2:#f0ecff;--accent3:#d7ccfe;--warm:#e6ddff;
 --tint:linear-gradient(170deg,#f4efff 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#ece5ff 0%,transparent 70%)}
[data-theme="ocean"]{--bg:#f9fbfe;--line:#e8edf4;--line2:#f2f6fb;--hover:#f4f8fd;--sel:#e9f0f9;
 --accent:#1f7ff0;--accent2:#e9f2fe;--accent3:#cfe4fd;--warm:#d8e9fd;
 --tint:linear-gradient(170deg,#e9f3ff 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#dcecff 0%,transparent 70%)}
[data-theme="citrus"]{--bg:#fffbf7;--line:#f4ece4;--line2:#faf4ee;--hover:#fdf6ef;--sel:#f8ece1;
 --accent:#f2703d;--accent2:#ffeee6;--accent3:#fbcbb4;--warm:#fddfcd;
 --tint:linear-gradient(170deg,#fff0e6 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#ffe6d5 0%,transparent 70%)}
[data-theme="mint"]{--bg:#f7fdfb;--line:#e4f0ec;--line2:#eff8f5;--hover:#f0faf6;--sel:#e3f3ee;
 --accent:#0d9488;--accent2:#e5f7f4;--accent3:#a9e3da;--warm:#cdeee8;
 --tint:linear-gradient(170deg,#e6f8f4 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#d6f3ec 0%,transparent 70%)}
[data-theme="midnight"]{--bg:#0d0f16;--card:#161a24;--line:#252b38;--line2:#1e2430;--hover:#1b212c;--sel:#232936;
 --ink:#f3f5fa;--ink2:#c9d0dd;--muted:#8b93a3;--faint:#626b7c;
 --accent:#7c72f0;--accent2:#251f3d;--accent3:#4b3d80;--warm:#2c2450;
 --greenbg:#10301f;--redbg:#37171a;
 --tint:linear-gradient(170deg,#221c3a 0%,#161a24 62%);--wash:radial-gradient(900px 320px at 12% -60px,#241d40 0%,transparent 70%)}
[data-theme="midnight"] .note{background:var(--greenbg);color:#5ed49a}
[data-theme="midnight"] .cell.hot{color:#c8b6ff}
[data-theme="rose"]{--bg:#fffafb;--line:#f4e8ec;--line2:#faf1f4;--hover:#fdf4f7;--sel:#f8e8ee;
 --accent:#c2185b;--accent2:#fdeaf1;--accent3:#f5bcd2;--warm:#fad3e0;
 --tint:linear-gradient(170deg,#fdeef3 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#fbe0ea 0%,transparent 70%)}
[data-theme="sand"]{--bg:#fdfbf6;--line:#efe9dd;--line2:#f7f3ea;--hover:#faf6ee;--sel:#f2ebdc;
 --accent:#a07c2c;--accent2:#f8f0dd;--accent3:#e3cf9d;--warm:#eedebf;
 --tint:linear-gradient(170deg,#f9f1de 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#f3e7cb 0%,transparent 70%)}
[data-theme="forest"]{--bg:#f8fbf8;--line:#e4eee5;--line2:#eff6ef;--hover:#f1f8f1;--sel:#e4f0e6;
 --accent:#1f6b3a;--accent2:#e7f4ea;--accent3:#aed8ba;--warm:#cfe8d5;
 --tint:linear-gradient(170deg,#e9f5ec 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#daeede 0%,transparent 70%)}
[data-theme="plum"]{--bg:#fdfaff;--line:#eee6f3;--line2:#f6f1f9;--hover:#f9f4fc;--sel:#f0e7f6;
 --accent:#6b2f8f;--accent2:#f3e9fa;--accent3:#d7bce9;--warm:#e6d3f2;
 --tint:linear-gradient(170deg,#f5ecfb 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#eddcf7 0%,transparent 70%)}
[data-theme="slate"]{--bg:#fafbfc;--line:#e7eaee;--line2:#f2f4f7;--hover:#f4f6f9;--sel:#e9edf2;
 --accent:#3f5772;--accent2:#eaeff5;--accent3:#c2cfdd;--warm:#d9e2ec;
 --tint:linear-gradient(170deg,#edf1f6 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#e2e9f1 0%,transparent 70%)}
[data-theme="ink"]{--bg:#fcfbf9;--line:#eae7e1;--line2:#f4f2ee;--hover:#f6f4f0;--sel:#edeae3;
 --accent:#2f2b26;--accent2:#efece6;--accent3:#c9c2b6;--warm:#ded8cc;
 --tint:linear-gradient(170deg,#f2efe9 0%,#fff 62%);--wash:radial-gradient(900px 300px at 12% -60px,#e9e5dc 0%,transparent 70%)}
[data-theme="graphite"]{--bg:#141416;--card:#1c1c1f;--line:#2b2b30;--line2:#232327;--hover:#232327;--sel:#2a2a2f;
 --ink:#f4f4f5;--ink2:#cfcfd4;--muted:#8f8f98;--faint:#66666f;
 --accent:#c9a227;--accent2:#332c15;--accent3:#7a6620;--warm:#3a3118;
 --greenbg:#14301f;--redbg:#361a1a;
 --tint:linear-gradient(170deg,#282416 0%,#1c1c1f 62%);--wash:radial-gradient(900px 320px at 12% -60px,#2b2718 0%,transparent 70%)}
[data-theme="graphite"] .note{background:var(--greenbg);color:#7fd3a3}
[data-theme="graphite"] .cell.hot{color:#e8cf7a}
[data-theme="navy"]{--bg:#0b1220;--card:#121a2b;--line:#222d44;--line2:#1a2338;--hover:#1b2439;--sel:#213050;
 --ink:#eef2fb;--ink2:#c4cee0;--muted:#8994a8;--faint:#63718a;
 --accent:#5b9dff;--accent2:#16294a;--accent3:#2f5a9c;--warm:#1b3358;
 --greenbg:#0f2e22;--redbg:#331a1f;
 --tint:linear-gradient(170deg,#16294a 0%,#121a2b 62%);--wash:radial-gradient(900px 320px at 12% -60px,#16294a 0%,transparent 70%)}
[data-theme="navy"] .note{background:var(--greenbg);color:#6fd7a6}
[data-theme="navy"] .cell.hot{color:#9cc4ff}
html,body{height:100%}
body{font-family:var(--sans);background:var(--card);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13.5px;letter-spacing:-.006em;font-feature-settings:'cv05','ss01','tnum' 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--sel);border-radius:8px;border:3px solid var(--card)}

.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sb{width:216px;flex:none;border-right:1px solid var(--line);padding:16px 10px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;font-weight:600;font-size:17.5px;letter-spacing:-.025em}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--faint);letter-spacing:.04em}
.sbgrp{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--faint);padding:16px 10px 8px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.savedline{margin-top:auto;padding-top:14px;border-top:1px solid var(--line2);font-size:11px;color:var(--faint);padding:0 4px;line-height:1.5}
.savedline b{color:var(--muted);font-weight:600}
.savedline.err{color:var(--red)}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--red);color:#fff;padding:11px 16px;
 display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;
 box-shadow:0 -8px 24px -14px rgba(0,0,0,.5)}
#savebar b{font-weight:700}
.savedline.err b{color:var(--red)}
.sbfoot kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--faint)}
.sbfoot{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;background:var(--bg);background-image:var(--wash);background-repeat:no-repeat;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 26px 0}
.h1{font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:-.015em;letter-spacing:-.01em;line-height:1.12}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:7px;padding:16px 26px 0;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:999px;font-weight:550;color:var(--ink2);font-size:13px}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--sel);color:var(--ink);font-weight:600}
.wrap{padding:18px 26px 60px;display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:18px;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.iconbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--hover)}
.avatars{display:flex;align-items:center;gap:7px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:650;border:1.5px solid var(--accent3);color:var(--accent);background:var(--card)}

/* ---------- cards ---------- */
.c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.chd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
.lbl.lnk{cursor:pointer}
.lbl.lnk:hover{color:var(--accent)}
.lbl.lnk:hover .arw{transform:translateX(2px)}
.arw{display:inline-block;transition:transform .15s}
.lbl{font:600 10.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.cbody{padding:0 18px 18px}
.big{font-size:25px;font-weight:600;letter-spacing:-.025em}
.delta{font-size:13px;font-weight:550;margin-top:2px}
.up{color:var(--green)}.dn{color:var(--red)}
.seg{display:flex;background:var(--sel);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.range{display:flex;justify-content:center;gap:4px;margin-top:6px}
.range button{padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted)}
.range button.on{background:var(--sel);color:var(--ink)}
.ghost{border:1px solid var(--line);border-radius:11px;padding:11px;width:100%;text-align:center;font-weight:550;color:var(--ink2)}
.ghost:hover{background:var(--hover)}
.btn{background:var(--ink);color:var(--card);border-radius:10px;padding:9px 16px;font-weight:600;font-size:13px}
.btn:hover{opacity:.88}
.btn.sec{background:var(--sel);color:var(--ink)}
.btn.blue{background:var(--accent)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.pill{font:600 11px/1 var(--sans);padding:4px 9px;border-radius:999px;background:var(--sel);color:var(--muted)}
.spark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--violet)}
.spark:hover{background:var(--hover)}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}

/* right rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:18px}
.rail .c.tint{background:var(--tint)}
.insight h4{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:-.015em;letter-spacing:-.005em;line-height:1.2;margin-bottom:9px}
.insight p{color:var(--ink2);font-size:12.8px;line-height:1.58}
.bar{height:7px;border-radius:99px;background:var(--sel);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.note{background:var(--greenbg);color:#0b7a45;border-radius:10px;padding:9px;text-align:center;font-size:12.5px;font-weight:600;margin-top:12px}

/* transactions */
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.tx:first-child{border-top:none}
.ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;background:var(--sel)}
.tx .nm{font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mt{color:var(--faint);font-size:12px;margin-top:2px}
tr.dgrp td{background:var(--hover);font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.c .cbody tr .moneyhint,td .moneyhint{display:none}
.moneyhint{font:600 11px/1 var(--mono);color:var(--faint);margin-top:5px;letter-spacing:.03em;min-height:11px}
.starw{color:var(--amber);display:inline-flex;align-items:center;line-height:0}
.star{vertical-align:middle}
.sw{width:32px;height:19px;border-radius:99px;background:var(--sel);flex:none;position:relative;transition:.15s}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on i{left:15.5px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{font:600 10px/1 var(--mono);letter-spacing:.1em;color:var(--faint);text-align:center;padding-bottom:4px}
.cell{border:1px solid var(--line);border-radius:9px;min-height:50px;padding:6px 7px;font-size:11px;color:var(--faint)}
.cell b{display:block;font-weight:600;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.cell.z{background:var(--hover);border-style:dashed}
.cell.hot{background:var(--accent);border-color:var(--accent);color:#cfe4fd}
.cell.hot b{color:#fff}
.cell.warm{background:var(--warm);border-color:transparent}

/* table */
table{width:100%;border-collapse:collapse}
.crow td{padding:3px 8px}
.crow input[data-rename]{border:1px solid transparent;background:none}
.crow input[data-rename]:hover{border-color:var(--line);background:var(--card)}
th{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--hover)}
.r{text-align:right}
select.cat,input.inp,textarea.inp,select.inp{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);color:var(--ink);font-size:13px;max-width:100%}
select.cat{font-size:12.5px;padding:5px 7px;color:var(--ink2)}
input.inp:focus,select.inp:focus,textarea.inp:focus,select.cat:focus{outline:2px solid var(--accent3);outline-offset:-1px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#f2f2f5;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px}
.kpi{padding:15px 17px;border-top:3px solid var(--kc,var(--accent))}
.kpi .lbl{color:var(--kc,var(--muted))}
.kpi .v{color:var(--ink)}
.kpi .v{font-size:19px;font-weight:640;letter-spacing:-.02em;margin-top:7px}
.kpi .s{font-size:12.5px;margin-top:3px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px;font-weight:400}
.tip{font-size:12px;color:var(--muted);line-height:1.6}
.adv{border-top:1px solid var(--line2);padding:14px 0;display:flex;gap:12px}
.adv:first-child{border-top:none;padding-top:4px}
.adv .bdg{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px}
.adv h5{font-size:13.5px;font-weight:600;margin-bottom:3px}
.adv p{color:var(--ink2);font-size:12.6px;line-height:1.6}
svg .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.axl{font:500 10px var(--mono);fill:var(--faint)}
#tt{position:fixed;z-index:60;background:#15181d;color:#fff;padding:7px 10px;border-radius:9px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:260px}
#tt b{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(15,17,21,.34);display:none;place-items:center;z-index:70;padding:20px;overflow:auto}
.modal.on{display:grid}
.sheet{background:var(--card);border-radius:18px;width:min(780px,100%);padding:22px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.drop{border:1.5px dashed var(--accent3);background:var(--hover);border-radius:14px;padding:34px;text-align:center;color:var(--muted)}
.drop.hover{background:var(--accent2);border-color:var(--accent)}
.toast{pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#15181d;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:550;opacity:0;transition:.22s;z-index:90}

async function tryTwice(fn,tries=5){
 let last;
 for(let i=0;i<tries;i++){
  try{return await fn();}
  catch(e){last=e;await new Promise(r=>setTimeout(r,300*(i+1)));}
 }
 throw last;
}
async function doSave(){
 if(memOnly||!STORE){dirty=false;return;}
 if(saving){pendingSave=true;return;}
 saving=true;updateSaved();
 try{
  S.settings.lastSaved=new Date().toISOString();
  S.settings.txnCount=S.txns.length;            /* load compares this, so a short read is caught */
  const {txns,...core}=S;
  const tj=JSON.stringify(S.txns);
  if(tj!==lastTxnJSON){await tryTwice(()=>putVerified(TKEY,tj));lastTxnJSON=tj;}
  await tryTwice(()=>putVerified(KEY,JSON.stringify(core)));
  /* a rolling second copy, at most every five minutes, in case the first is ever lost */
  if(Date.now()-lastBak>300000){
   lastBak=Date.now();
   try{await putVal(BKEY,JSON.stringify({at:S.settings.lastSaved,core,txns:S.txns}));}catch(e){}
  }
  saveErr='';dirty=false;failCount=0;
 }catch(e){
  failCount++;
  saveErr=(e&&e.message)||'could not save';
  console.error('save failed',e);
  if(failCount<6)setTimeout(()=>{saving=false;doSave();},4000);   /* keep trying in the background */
 }
 saving=false;updateSaved();renderSaveBar();
 if(pendingSave){pendingSave=false;persist();}
}
setInterval(()=>{if(dirty&&!saving)doSave();},20000);             /* heartbeat: nothing sits unsaved for long */

   const bk=await getVal(BKEY);
   if(bk){try{const B=JSON.parse(bk);
    if((B.txns||[]).length>=want){Object.assign(S,B.core||{},{txns:B.txns});lastTxnJSON=null;
     loadNote=`Recovered ${B.txns.length.toLocaleString()} transactions from the backup copy`;}}catch(e){}}
  }
 }catch(e){CK=null;LOCK={salt:SALT,err:'That passphrase did not work.'};return renderLock();}

function merchantKey(d){
 return d.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b\d+\b/g,' ')
  .replace(/\b(pos|ibft|trf|txn|ref|purchase|payment|card|visa|master|atm|hbl|ubl|mcb|meezan|alfalah|askari|faysal|js bank|bank)\b/g,' ')
  .split(/\s+/).filter(Boolean).slice(0,3).join(' ').trim();
}
function guessCat(desc,amount){
 const d=(desc||'').toLowerCase(), k=merchantKey(desc);
 const R=ruleFor(desc,amount);if(R)return R.cat;
 if(k&&S.rules[k])return S.rules[k];
 for(const [re,id] of KW){if(!re.test(d))continue;const ty=(S.cats.find(c=>c.id===id)||{}).type;
  if(amount<0&&ty==='income')continue;            /* "maid salary" is not your salary */
  if(amount>0&&ty==='expense')continue;           /* money coming back is a refund, not a purchase */
  return id;}
 if(amount>0)return /salary|payroll/.test(d)?'salary':'giftin';
 return 'misc';
}

/* ---------- PDF text extraction, no libraries and no network ---------- */
async function inflate(bytes){
 if(typeof DecompressionStream==='undefined')throw new Error('This browser cannot unpack PDF streams.');
 for(const fmt of ['deflate','deflate-raw']){
  try{const ab=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt))).arrayBuffer();
   return new Uint8Array(ab);}catch(e){}
 }
 throw new Error('stream');
}
function a85(bytes){
 let s=L1(bytes).replace(/\s/g,'');
 if(s.startsWith('<~'))s=s.slice(2);
 const e=s.indexOf('~>');if(e>=0)s=s.slice(0,e);
 const out=[];let tup=[];
 for(const ch of s){
  if(ch==='z'&&tup.length===0){out.push(0,0,0,0);continue;}
  const v=ch.charCodeAt(0)-33;if(v<0||v>84)continue;
  tup.push(v);
  if(tup.length===5){let n=0;for(const t of tup)n=n*85+t;
   out.push((n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255);tup=[];}
 }
 if(tup.length>1){const k=tup.length;for(let j=k;j<5;j++)tup.push(84);
  let n=0;for(const t of tup)n=n*85+t;
  const b=[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
  for(let j=0;j<k-1;j++)out.push(b[j]);}
 return new Uint8Array(out);
}
function ahex(bytes){
 const s=L1(bytes).replace(/[^0-9A-Fa-f]/g,''),out=[];
 for(let i=0;i<s.length;i+=2)out.push(parseInt(s.slice(i,i+2).padEnd(2,'0'),16));
 return new Uint8Array(out);
}
async function decodeStream(o){
 let data=o.data;if(!data)return null;
 const f=(o.dict.match(/\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/)||[])[1]||'';
 const list=(f.match(/\/([A-Za-z0-9]+)/g)||[]).map(x=>x.slice(1));
 for(const name of list){
  if(name==='ASCII85Decode')data=a85(data);
  else if(name==='ASCIIHexDecode')data=ahex(data);
  else if(name==='FlateDecode')data=await inflate(data);
  else if(name==='LZWDecode')throw new Error('lzw');
  else return null;   /* images and anything else are not text */
 }
 return data;
}
const L1=u8=>{let s='',C=8192;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return s;};

 while((m=re.exec(all)))starts.push({num:m[1],at:m.index,dictAt:re.lastIndex});
 starts.forEach((s,i)=>{
  const stop=i+1<starts.length?starts[i+1].at:all.length;
  const seg=all.slice(s.dictAt,stop);
  const si=seg.indexOf('stream');
  let dict=seg,data=null;
  if(si>=0){
   dict=seg.slice(0,si);
   let ds=s.dictAt+si+6;
   if(all[ds]==='\r')ds++;

function stackChart(rows,keys,o={}){ /* rows:[{x,vals:{key:v}}] */

/* ---- sankey ---- */
function sankey(nodes,links,o={}){
 const W=o.w||1000,NW=o.nw||11,GAP=o.gap||20,PT=16,PB=16;
 const cols=[...new Set(nodes.map(n=>n.col))].sort((a,b)=>a-b);
 nodes.forEach(n=>{n.in=links.filter(l=>l.to===n.id).reduce((s,l)=>s+l.v,0);
  n.out=links.filter(l=>l.from===n.id).reduce((s,l)=>s+l.v,0);n.v=Math.max(n.in,n.out,n.v||0);});
 const colNodes=cols.map(c=>nodes.filter(n=>n.col===c).sort((a,b)=>b.v-a.v));
 const maxTot=Math.max(...colNodes.map(ns=>ns.reduce((s,n)=>s+n.v,0)),1);
 const maxN=Math.max(...colNodes.map(ns=>ns.length));
 const H=o.h||Math.max(380,maxN*58+PT+PB);
 const usable=H-PT-PB-GAP*(maxN-1),sc=usable/maxTot;
 const padL=o.padL??20,padR=o.padR??210;
 const span=W-NW-padL-padR,cx=cols.length>1?span/(cols.length-1):0;
 colNodes.forEach((ns,ci)=>{const tot=ns.reduce((s,n)=>s+n.v,0);
  let y=PT+(H-PT-PB-(tot*sc+GAP*(ns.length-1)))/2;
  ns.forEach(n=>{n.h=Math.max(3,n.v*sc);n.y=y;n.x=padL+ci*cx;n.ci=ci;y+=n.h+GAP;n.sy=n.y;n.ty=n.y;});});
 const N=id=>nodes.find(n=>n.id===id);
 links.sort((a,b)=>{const A=N(a.from),B=N(b.from);return (A?A.y:0)-(B?B.y:0)||(N(a.to)?N(a.to).y:0)-(N(b.to)?N(b.to).y:0);});
 const gid='sk'+(++chartSeq);
 let defs='',ribbons='';
 links.forEach((l,i)=>{const s=N(l.from),t=N(l.to);if(!s||!t)return;
  const hgt=Math.max(1.2,l.v*sc),x1=s.x+NW,x2=t.x,y1=s.sy,y2=t.ty;
  s.sy+=hgt;t.ty+=hgt;
  const c1=x1+(x2-x1)*0.5,c2=x1+(x2-x1)*0.5;
  defs+=`<linearGradient id="${gid}l${i}" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${s.color}" stop-opacity=".42"/>
    <stop offset="1" stop-color="${t.color}" stop-opacity=".42"/></linearGradient>`;
  ribbons+=`<path d="M${x1} ${y1} C${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2} L${x2} ${y2+hgt} C${c2} ${y2+hgt}, ${c1} ${y1+hgt}, ${x1} ${y1+hgt} Z"
    fill="url(#${gid}l${i})" data-tip="${esc(s.label)} → ${esc(t.label)}<br><b>${fmt(l.v)}</b>"/>`;});
 let bars='';
 const last=cols.length-1;
 colNodes.forEach((ns,ci)=>{
  const side=ci===0||ci===last?'right':'above';
  let prev=-1e9;
  ns.slice().sort((a,b)=>a.y-b.y).forEach(n=>{
   bars+=`<rect x="${n.x}" y="${n.y}" width="${NW}" height="${n.h}" rx="${Math.min(4,NW/2)}" fill="${n.color}"
     data-tip="${esc(n.label)}<br><b>${fmt(n.v)}</b>"/>`;
   if(n.h<3.5)return;
   let ly,tx,anchor='start';
   if(side==='above'){ly=Math.max(n.y-9,PT+10);tx=n.x+NW+9;}
   else{ly=n.y+n.h/2;tx=ci===0?n.x+NW+13:n.x+NW+13;}
   if(side!=='above'){                         /* keep stacked labels from sitting on top of each other */
    if(ly-prev<28)ly=prev+28;
    ly=Math.min(ly,H-14);
    prev=ly;
   }
   bars+=`<text x="${tx}" y="${ly-3}" text-anchor="${anchor}" font-size="12" font-weight="600" fill="var(--ink)">${esc(n.label)}</text>
    <text x="${tx}" y="${ly+12}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${esc(n.sub||fmtS(n.v))}</text>`;});});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
  <defs>${defs}</defs>${ribbons}${bars}</svg>`;
}

function acctLinks(a){
 if(Array.isArray(a.links))return a.links;
 if(!a.link)return [];
 if(a.link==='__exp')return S.cats.filter(c=>c.type==='expense').map(c=>c.id);
 if(a.link==='__save')return S.cats.filter(c=>c.type==='save').map(c=>c.id);
 return [a.link];
}
function acctFlows(a){
 const ls=acctLinks(a);if(!ls.length)return {in:0,out:0,net:0};
 const from=a.asOf||'';
 let inn=0,out=0;
 S.txns.filter(t=>!t.excl&&!t.split&&(!from||t.date>from)&&ls.includes(t.cat))
  .forEach(t=>{const v=Math.abs(t.amount);
   if(cat(t.cat).type==='income')inn+=v;else out+=v;});
 return {in:inn,out,net:inn-out};
}
function linkName(a){
 const ls=acctLinks(a);
 if(!ls.length)return '';
 const names=ls.map(id=>catName(id));
 return names.length<=2?names.join(' and '):`${names[0]}, ${names[1]} and ${names.length-2} more`;
}
function normType(a){
 if(ATYPES.includes(a.type))return a.type;
 a.owed=['Credit card','Loan','Other liability'].includes(a.type||'');
 a.type=a.owed?'Expenses':'Savings & investments';   /* legacy types land somewhere sensible */
 return a.type;
}
function kindOf(a){

function acctBalance(a){
 a.kind=kindOf(a);
 const base=Math.abs(+a.value||0),F=acctFlows(a);
 /* income adds, spending takes away — for a debt that means borrowing raises it and repayments lower it */
 /* a debt can't go below nothing; an account that goes negative is telling you the links
    or the as-of date are wrong, so show it rather than hide it */
 let raw;
 if(a.kind==='flow')raw=a.type==='Income'?F.in:F.out;   /* a running total, not a balance */
 else raw=base+F.net;
 const v=a.kind==='liability'?Math.max(0,raw):raw;
 return {base,inn:F.in,out:F.out,net:F.net,moved:Math.abs(F.net),v};
}

let FL={mode:'month',key:'',detail:'group'};

function flowGraph(tx,detail){
 const inc=catTotals(tx,'income'),spend=catTotals(tx),sav=catTotals(tx,'save');
 const gExp=groupTotals(tx),gSav=groupTotals(tx,'save');
 const totIn=inc.reduce((s,c)=>s+c.v,0),totOut=spend.reduce((s,c)=>s+c.v,0),totSav=sav.reduce((s,c)=>s+c.v,0);
 const keep=totIn-totOut,leaves=[...spend,...sav];
 const nodes=[],links=[];
 const pc=(v,base)=>base?` (${(v/base*100).toFixed(v/base<0.1?2:1)}%)`:'';
 const add=(id,label,col,color,v,base)=>{nodes.push({id,label,col,color,v,sub:fmt(v)+pc(v,base)});};
 if(totIn>0){
  inc.forEach(c=>{add('i'+c.id,c.name,0,c.color,c.v,totIn);links.push({from:'i'+c.id,to:'IN',v:c.v});});
  add('IN','Money in',1,'#0f9d58',totIn,totIn);
  /* everything that is not spent is saved, whether it was moved deliberately or simply left */
  const saved=totIn-totOut;
  if(totOut>0){add('OUT','Expenses',2,'#4f46e5',totOut,totIn);links.push({from:'IN',to:'OUT',v:totOut});}
  if(saved>0){add('SAV','Savings',2,'#12a5a5',saved,totIn);links.push({from:'IN',to:'SAV',v:saved});}
  if(detail==='cat'){
   spend.forEach(c=>{add('c'+c.id,c.name,3,c.color,c.v,totOut);links.push({from:'OUT',to:'c'+c.id,v:c.v});});
  }else{
   gExp.forEach(g=>{const c2=S.cats.find(c=>c.group===g.g);
    add('g'+g.g,g.g,3,c2?c2.color:'#4f46e5',g.v,totOut);links.push({from:'OUT',to:'g'+g.g,v:g.v});});
  }
 }else{
  const groups=[...gExp,...gSav];
  groups.forEach(g=>{const c2=S.cats.find(c=>c.group===g.g);
   add('g'+g.g,g.g,0,c2?c2.color:'#4f46e5',g.v,totOut+totSav);});
  leaves.forEach(c=>{add('c'+c.id,c.name,1,c.color,c.v,totOut+totSav);links.push({from:'g'+c.group,to:'c'+c.id,v:c.v});});
 }
 return {inc,spend,sav,grp:[...gExp,...gSav],totIn,totOut,totSav,keep,leaves,nodes,links};
}

const GKIND=[['home','🏠','House down payment'],['rent','🔑','Apartment rent & deposit'],['emergency','🛟','Emergency fund'],
 ['car','🚗','Car'],['wedding','💍','Wedding'],['hajj','🕋','Hajj or Umrah'],['edu','🎓','Education'],['travel','✈️','Travel'],['other','⭐','Something else']];
const gEmo=k=>(GKIND.find(x=>x[0]===k)||GKIND[8])[1];
const goalSaved=g=>(+g.saved||0)+(g.adds||[]).reduce((s,a)=>s+(+a.amount||0),0);
function monthsUntil(d){if(!d)return 0;const t=new Date(d),n=new Date();return Math.max(0,Math.round((t-n)/2629800000));}
function capacity(n=6){
 const cur=new Date().toISOString().slice(0,7);
 const ks=monthsOf().filter(k=>k!==cur).slice(-n);
 if(!ks.length)return 0;
 return ks.reduce((s,k)=>{const a=txIn(k);return s+sumInc(a)-sumSpend(a);},0)/ks.length;
}
function rateSeries(n=12){
 const cur=new Date().toISOString().slice(0,7);
 return monthsOf().filter(k=>k!==cur).slice(-n).map(k=>{const a=txIn(k),i=sumInc(a),s=sumSpend(a);
  return {x:MON[+k.slice(5,7)-1],label:monthLabel(k),y:i?Math.round((i-s)/i*1000)/10:0};});
}
function goalPlan(){
 const cap=capacity();
 const gs=S.goals.map(g=>{const saved=goalSaved(g),rem=Math.max(0,(+g.target||0)-saved),ml=monthsUntil(g.due);
  return {g,saved,rem,ml,need:ml>0?rem/ml:rem,plan:+g.monthly||0};});
 const planned=gs.reduce((s,x)=>s+x.plan,0),free=Math.max(0,cap-planned);
 const open=gs.filter(x=>!x.plan&&x.rem>0),totNeed=open.reduce((s,x)=>s+x.need,0)||1;
 open.forEach(x=>x.alloc=free*(x.need/totNeed));
 gs.forEach(x=>{x.rate=x.plan||x.alloc||0;
  x.months=x.rem<=0?0:(x.rate>0?Math.ceil(x.rem/x.rate):Infinity);
  x.eta=x.months===Infinity?null:addMonth(new Date().toISOString().slice(0,7),x.months);
  x.pct=Math.min(100,x.saved/((+x.g.target)||1)*100);
  x.state=x.rem<=0?'done':x.months===Infinity?'stalled':!x.ml?'open':x.months<=x.ml*0.9?'ahead':x.months<=x.ml?'ontrack':'behind';});
 return {cap,gs,committed:gs.reduce((s,x)=>s+x.rate,0)};
}

const P=()=>S.profile;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Salaried slabs. Pakistan changes these every Finance Act, so they live in editable data
   rather than in code — Tax → Slabs lets anyone enter next year's bands when the budget lands. */
const SLABS_DEFAULT={2027:[[0,0,0],[600000,.01,0],[1200000,.11,6000],[2200000,.20,116000],
 [3200000,.25,316000],[4100000,.29,541000],[5600000,.32,976000],[7000000,.35,1424000]]};
function slabYears(){return Object.keys(Object.assign({},SLABS_DEFAULT,(S&&S.slabs)||{})).map(Number).sort((a,b)=>a-b);}
function slabsFor(y){
 const all=Object.assign({},SLABS_DEFAULT,(S&&S.slabs)||{});
 if(all[y])return {rows:all[y],year:y,exact:true};
 const yrs=Object.keys(all).map(Number).sort((a,b)=>a-b);
 const use=yrs.filter(x=>x<=y).pop()||yrs[0];
 return {rows:all[use],year:use,exact:false};        /* carried forward until someone updates them */
}
const taxYearNow=()=>taxYearInfo().cur;
function incomeTax(x,y){
 if(!(x>0))return 0;
 const rows=slabsFor(y||taxYearNow()).rows;
 let i=0;for(let j=0;j<rows.length;j++)if(x>rows[j][0])i=j;
 return rows[i][2]+rows[i][1]*(x-rows[i][0]);
}
function slabOf(x,y){
 const rows=slabsFor(y||taxYearNow()).rows;
 let i=0;for(let j=0;j<rows.length;j++)if(x>rows[j][0])i=j;return i;
}
function earnedAnnual(){const ks=monthsOf().filter(k=>k!==new Date().toISOString().slice(0,7));
 if(!ks.length)return 0;const last=ks.slice(-6);return last.reduce((s,k)=>s+sumInc(txIn(k)),0)/last.length*12;}
function taxPicture(){
 const p=P();const gross=+p.grossAnnual||Math.round(earnedAnnual());
 const other=+p.otherAnnual||0,taxable=Math.max(0,gross+other);
 const base=incomeTax(taxable);
 const vps=clamp(+p.vps||0,0,taxable*0.2);
 const avgRate=taxable?base/taxable:0;
 const credit=vps*avgRate;
 const due=Math.max(0,base-credit);
 const paid=+p.taxPaidAnnual||0;
 return {gross,other,taxable,base,vps,credit,due,paid,bal:paid-due,monthly:due/12,
  eff:taxable?due/taxable*100:0,marg:slabsFor(taxYearNow()).rows[slabOf(taxable)][1]*100,net:taxable-due,slab:slabOf(taxable)};
}
function ageOf(){return +P().age||0;}
function lifeStage(){const a=ageOf();
 if(!a)return {k:'',t:'Add your age',d:'Age changes almost every benchmark on this page — targets, allocation, insurance, retirement runway.'};
 if(a<26)return {k:'Foundation',t:'Building the base',d:'The single highest-return move in your twenties is a savings habit and zero expensive debt. Small amounts compound for forty years.'};
 if(a<36)return {k:'Accumulation',t:'Compounding decade',d:'Income is rising faster than at any other point. The trap is letting spending rise with it — every rupee of lifestyle creep now costs you decades of growth.'};
 if(a<46)return {k:'Peak earning',t:'Highest leverage years',d:'Dependents, school fees and property usually collide here. Protection matters as much as growth: cover, emergency fund, and no single point of failure.'};
 if(a<56)return {k:'Consolidation',t:'Catch-up window',d:'Retirement is close enough to model properly. Clear debt, max out tax-advantaged saving, and start shifting risk down.'};
 return {k:'Preservation',t:'Protecting what you built',d:'Capital preservation and a predictable income stream matter more than returns. Sequence risk is the real enemy now.'};
}
function nwTargetMult(a){const pts=[[30,1],[35,2],[40,3],[45,4],[50,6],[55,7],[60,8]];
 if(a<=30)return Math.max(0,(a-24)/6);
 for(let i=1;i<pts.length;i++)if(a<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(a-x0)/(x1-x0);}

function efTarget(){const p=P();return (+p.kids||0)>0||p.marital==='married'?6:3;}

 const kept=Math.max(0,netWorthNow());

}
function liquidCashOld(){return S.accounts.filter(a=>a.kind!=='liability'&&a.kind!=='flow'&&['Cash','Savings','Current account'].includes(a.type)).reduce((s,a)=>s+acctValue(a),0);}
function investable(){return S.accounts.filter(a=>a.kind!=='liability'&&!['Property','Other asset'].includes(a.type)).reduce((s,a)=>s+(+a.value||0),0);}
function debtTotal(){return S.accounts.filter(a=>a.kind==='liability').reduce((s,a)=>s+Math.abs(+a.value||0),0);}

function allocActual(){const m={eq:0,fixed:0,gold:0,cash:0};
 S.accounts.filter(a=>a.kind!=='liability').forEach(a=>{const v=+a.value||0;
  if(['Stocks (PSX)','Crypto'].includes(a.type))m.eq+=v;
  else if(['Mutual funds','Pension/Provident'].includes(a.type))m.fixed+=v;
  else if(a.type==='Gold')m.gold+=v;
  else if(['Cash','Savings','Current account'].includes(a.type))m.cash+=v;});
 const t=m.eq+m.fixed+m.gold+m.cash||1;
 return {eq:m.eq/t*100,fixed:m.fixed/t*100,gold:m.gold/t*100,cash:m.cash/t*100,total:t};}
function retirementPlan(){
 const p=P(),a=ageOf();if(!a)return null;
 const yrs=Math.max(0,(+p.retireAge||60)-a),r=(+p.ret||12)/100,inf=(+p.infl||7)/100;
 const spendNow=avgSpend()*12||sumSpend(txIn(nowKey()))*12;
 const spendThen=spendNow*Math.pow(1+inf,yrs);
 const need=spendThen*20;
 const m=capacity(),mr=r/12,n=yrs*12;
 const fv=investable()*Math.pow(1+r,yrs)+(mr?m*((Math.pow(1+mr,n)-1)/mr):m*n);
 return {yrs,spendNow,spendThen,need,fv,gap:need-fv,monthly:m,
  needMonthly:mr&&n?((need-investable()*Math.pow(1+r,yrs))*mr)/(Math.pow(1+mr,n)-1):0};
}

function scoreFor(k){
 const tx=txIn(k),inc=sumInc(tx),sp=sumSpend(tx);
 const parts=[];
 const sr=inc?(inc-(k===new Date().toISOString().slice(0,7)?projectMonth(k).proj:sp))/inc*100:0;
 parts.push({id:'sr',label:'Savings rate',max:25,pts:clamp(sr/30*25,0,25),val:sr.toFixed(0)+'%',
  tip:'Keeping 30% of income scores full marks. Every 1.2 points of savings rate is worth a point here.'});
 const isCur=k===new Date().toISOString().slice(0,7);
 const PJ=projectMonth(k),run=isCur?PJ.proj:sp;           /* judge the month it is heading for */
 const bud=totalBudget();
 parts.push({id:'bud',label:'Budget discipline',max:15,pts:bud?clamp((1.4-run/bud)/0.4*15,0,15):6,
  val:bud?Math.round(run/bud*100)+'% of budget'+(isCur?' projected':' used'):'no budget',
  tip:bud?'Landing at or under budget is full marks; 140% of budget scores zero. Part-way through a month this reads your projected finish, not the raw total.':'Set a budget and this starts scoring properly.'});
 const a6=avgSpend(),dev=a6?Math.abs(run-a6)/a6:0;
 parts.push({id:'stab',label:'Spending stability',max:10,pts:clamp((0.35-dev)/0.35*10,0,10),
  val:a6?(run>a6?'+':'')+((run/a6-1)*100).toFixed(0)+'% vs usual':'—',
  tip:'Months that look like your other months score highest. Wild swings make planning impossible.'});
 const mo=a6?liquidCash()/a6:0,eft=efTarget();
 parts.push({id:'ef',label:'Emergency fund',max:15,pts:clamp(mo/eft*15,0,15),val:mo.toFixed(1)+' months',
  tip:`Your situation calls for ${eft} months of cash. That is the target this scores against.`});
 const ann=(P().grossAnnual||inc*12)||1,dr=debtTotal()/ann;
 parts.push({id:'debt',label:'Debt load',max:15,pts:clamp((1-dr/0.8)*15,0,15),val:(dr*100).toFixed(0)+'% of annual income',
  tip:'Debt at or above 80% of a year of income scores zero. Debt-free is full marks.'});
 const G=S.goals.length?goalPlan():null;
 const ok=G?G.gs.filter(x=>['ahead','ontrack','done'].includes(x.state)).length/G.gs.length:0;
 parts.push({id:'goal',label:'Goals on track',max:10,pts:G?ok*10:4,val:G?`${G.gs.filter(x=>['ahead','ontrack','done'].includes(x.state)).length} of ${G.gs.length}`:'no goals',
  tip:G?'Each goal funded well enough to hit its date adds to this.':'Add goals and this scores on whether they are funded to land on time.'});
 const nws=nwSeries(),i=nws.findIndex(x=>x.k===k);
 const back=i>2?nws[i-3]:nws[0],now=i>=0?nws[i]:nws[nws.length-1];
 const g=back&&now&&back.y?(now.y-back.y)/Math.abs(back.y):0;
 parts.push({id:'nw',label:'Net worth trend',max:10,pts:clamp((g/0.06)*10,0,10),val:(g*100).toFixed(1)+'% in 3 months',
  tip:'Growing net worth 6% over a quarter is full marks here.'});
 const total=parts.reduce((s,x)=>s+x.pts,0);
 return {total:Math.round(total),parts};
}

let FC={tab:'nw'};
const END_AGE=90;
function fcParams(o={}){
 const p=P(),age=ageOf()||30;
 return {age,retire:(+p.retireAge||60)+(o.retireDelta||0),
  r:((o.ret!=null?o.ret:(+p.ret||12))/100),inf:(+p.infl||7)/100,
  save:Math.max(0,capacity()+(o.extra||0)),
  spendA:(avgSpend()*12)||(sumSpend(txIn(nowKey()))*12),
  spendCut:o.spendCut||0};
}
function forecast(o={}){
 const q=fcParams(o);let nw=netWorthNow();const rows=[];
 for(let a=q.age;a<=END_AGE;a++){
  const yrs=a-q.age,inflF=Math.pow(1+q.inf,yrs),working=a<q.retire;
  const grow=working?q.r:Math.max(.04,q.r-.03);
  let flow=working?q.save*12*inflF:-(q.spendA*inflF*(1-q.spendCut));
  let evLabel=[];
  (S.events||[]).forEach(e=>{const y=+e.years||1;
   if(a>=+e.age&&a<+e.age+y){flow+=(e.kind==='income'?1:-1)*Math.abs(+e.amount||0)*Math.pow(1+q.inf,a-+e.age);
    if(a===+e.age)evLabel.push(e);}});
  nw=(nw>0?nw*(1+grow):nw)+flow;   /* no compounding on a negative balance */
  rows.push({age:a,nw,flow,working,ev:evLabel});
 }
 return {rows,end:rows[rows.length-1].nw,q};
}
function successRate(o={},sims=280){
 const q=fcParams(o);let ok=0;
 for(let s=0;s<sims;s++){
  let nw=netWorthNow(),alive=true;
  for(let a=q.age;a<=END_AGE;a++){
   const yrs=a-q.age,inflF=Math.pow(1+q.inf,yrs),working=a<q.retire;
   const mean=working?q.r:Math.max(.04,q.r-.03);
   const z=(Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3)/1.2;
   const grow=mean+z*0.15;
   let flow=working?q.save*12*inflF:-(q.spendA*inflF*(1-q.spendCut));
   (S.events||[]).forEach(e=>{const y=+e.years||1;if(a>=+e.age&&a<+e.age+y)flow+=(e.kind==='income'?1:-1)*Math.abs(+e.amount||0)*Math.pow(1+q.inf,a-+e.age);});
   nw=(nw>0?nw*(1+grow):nw)+flow;
   if(nw<0&&!working){alive=false;break;}
  }
  if(alive)ok++;
 }
 return Math.round(ok/sims*100);
}

 if(A.months.length>1){

 if(A.cash>A.sp*0.06)out.push(`<b>${fmt(A.cash)}</b> left as cash and was never itemised — ${(A.cash/(A.sp||1)*100).toFixed(0)}% of spending sits in a blind spot. Splitting withdrawals as they happen is the single easiest way to make next ${per}'s report more useful.`);
 if(B){const base={};B.cats.forEach(c=>base[c.id]=c.v);

function archiveYear(y,silent){

  stats:{inc:A.inc,sp:A.sp,sav:A.sav,rate:A.rate,n:A.n,top:A.top?A.top.name:'',topV:A.top?A.top.v:0},
  notes:repNotes('year',y)});

function taxYearInfo(d=new Date()){
 const y=d.getFullYear(),m=d.getMonth();
 const cur=m>=6?y+1:y;                       /* tax year ending 30 June of `cur` */
 const prev=cur-1;
 const elapsed=((m-6+12)%12)+1;              /* months into the current tax year */
 let fileDue=`${prev}-09-30`;                /* return for the year just ended */
 let fileFor=prev;
 if(new Date(fileDue)<d){fileDue=`${cur}-09-30`;fileFor=cur;}
 return {cur,prev,elapsed,fileDue,fileFor,start:`${cur-1}-07-01`,end:`${cur}-06-30`};
}
const daysTo=ds=>Math.ceil((new Date(ds)-new Date())/86400000);
const niceDate=ds=>{const d=new Date(ds);return `${d.getDate()} ${MONF[d.getMonth()]} ${d.getFullYear()}`;};
function taxPosition(){
 const T=taxPicture(),ty=taxYearInfo();
 const paid=+P().taxPaidAnnual||0;
 const expected=T.due/12*ty.elapsed;
 const runRate=ty.elapsed?paid/ty.elapsed:0;
 const bal=paid-expected;      /* + over-withheld so far, − short. assumes payroll gets the rest right */
 const projected=paid+T.monthly*(12-ty.elapsed);   /* if the remaining months are withheld correctly */
 const rateGap=runRate-T.monthly;
 return {...T,ty,paid,expected,runRate,projected,bal,rateGap};
}
function taxDates(){
 const ty=taxYearInfo(),p=P(),biz=p.employment!=='salaried';
 const L=[];
 L.push({d:ty.fileDue,t:`File your return for tax year ${ty.fileFor}`,
  b:`Income earned 1 July ${ty.fileFor-1} to 30 June ${ty.fileFor}, filed on the FBR IRIS portal along with your wealth statement. Missing it costs the higher of Rs 1,000 a day or 0.1% of tax payable, and drops you off the Active Taxpayer List until you file.`,key:true});
 [[`${ty.cur-1}-09-15`,'first'],[`${ty.cur-1}-12-15`,'second'],[`${ty.cur}-03-15`,'third'],[`${ty.cur}-06-15`,'fourth']]
  .forEach(([d,n])=>L.push({d,t:`Advance tax — ${n} instalment`,
   b:biz?`Business and freelance income pays tax in four instalments under section 147 rather than waiting for the return. Salary already taxed at source does not count towards this.`
        :`This applies to business, rental and freelance income. As a salaried filer with tax deducted by your employer, you can usually ignore it — unless you have side income that nothing withholds against.`,
   dim:!biz}));
 L.push({d:`${ty.cur}-06-30`,t:`Tax year ${ty.cur} closes`,
  b:`Anything you want counted for this year — pension contributions, donations, zakat — has to be paid before this date.`});
 L.push({d:`${ty.cur}-07-01`,t:`New slabs take effect for tax year ${ty.cur+1}`,
  b:`Budget changes announced in June apply from this date, and employers update payroll withholding on the first salary run of the new year.`});
 const today=new Date().toISOString().slice(0,10);
 return L.map(x=>({...x,days:daysTo(x.d),past:x.d<today})).sort((a,b)=>a.d.localeCompare(b.d));
}

function advice(){
 const out=[],k=nowKey(),tx=txIn(k),spent=sumSpend(tx),inc=sumInc(tx);
 const P=projectMonth(k),days=P.days,d=P.d;
 const hist=spanKeys(7,addMonth(k,-1)).map(kk=>sumSpend(txIn(kk))).filter(v=>v>0);
 const avg=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:0;
 const pp=pastPace(k,d),pace=pp?pp.to:avg*(d/days);
 if(pace&&spent>pace*1.08)out.push({t:'warn',title:'You’re spending faster than usual this month',
  body:`So far in ${MONF[+k.slice(5,7)-1]} you’ve spent <b>${fmt(spent)}</b>, about <b>${fmt(spent-pace)}</b> ahead of where you normally sit by day ${d} — roughly ${((spent/pace-1)*100).toFixed(0)}% above your trailing six-month rhythm. On this shape the month lands near <b>${fmt(P.proj)}</b>.`});
 else if(pace&&spent<pace*0.92)out.push({t:'good',title:'This month is running lighter than usual',
  body:`You’re <b>${fmt(pace-spent)}</b> below your usual pace by day ${d}. If it holds you’ll close near <b>${fmt(P.proj)}</b> against an average month of ${fmt(avg)}.`});
 const sr=inc?(inc-spent)/inc*100:null;
 if(sr!==null)out.push({t:sr>=20?'good':'warn',title:`You kept ${sr.toFixed(0)}% of what came in`,
  body:sr>=20?`On ${fmt(inc)} of income you held back ${fmt(inc-spent)}. Moving it out of the current account the day salary lands is what makes it stick.`
   :`On ${fmt(inc)} of income you kept ${fmt(inc-spent)}. Getting to 20% means freeing about ${fmt(inc*0.2-(inc-spent))} a month — usually easiest from the movers below.`});
 const prevKs=spanKeys(4,addMonth(k,-1)),base={};
 prevKs.forEach(kk=>catTotals(txIn(kk)).forEach(c=>base[c.id]=(base[c.id]||0)+c.v/prevKs.length));
 const mov=catTotals(tx).map(c=>({...c,d:c.v-(base[c.id]||0)})).sort((a,b)=>b.d-a.d)[0];
 if(mov&&mov.d>1000)out.push({t:'info',title:`${mov.name} is your biggest jump`,

   :`${fmt(liquid)} in cash covers ${mo.toFixed(1)} months of your ${fmt(avg)} average. Six months would mean about ${fmt(Math.max(0,avg*6-liquid))} more.`});}
 const debt=S.accounts.filter(a=>a.kind==='liability').reduce((s,a)=>s+Math.abs(+a.value||0),0);

function parseRow(r,map){
 const g=i=>i>=0&&i<r.length?r[i]:'';
 const date=parseDate(g(map.date),IMP.fmt==='auto'?null:IMP.fmt);if(!date)return null;
 let amt=NaN;
 if(map.debit>=0||map.credit>=0){const d=num(g(map.debit)),c=num(g(map.credit));
  if(!isNaN(d)&&d!==0)amt=-Math.abs(d);else if(!isNaN(c)&&c!==0)amt=Math.abs(c);}
 if(isNaN(amt)&&map.amount>=0)amt=num(g(map.amount));
 if(isNaN(amt)||amt===0)return null;
 const desc=(map.desc>=0?g(map.desc):'').trim().replace(/\s+/g,' ')||'Transaction';
 return {id:uid(),date,desc,amount:amt,cat:guessCat(desc,amt),src:IMP.name||'import'};
}
function repairRows(rows,w){
 return rows.map(r=>{if(r.length<=w)return r;const out=[];
  for(let i=0;i<r.length;i++){let c=(r[i]||'').trim();
   while(out.length+ (r.length-i) > w && i+1<r.length && /^-?\d{1,3}$/.test(c) && /^\d{3}(\.\d+)?$/.test((r[i+1]||'').trim())){c=c+','+r[++i].trim();}
   out.push(c);}
  return out;});
}
function readText(text,name){
 let rows=splitCSV(text);if(rows.length<2)return toast('That file has no readable rows');
 return ingestRows(rows,name);
}
function ingestRows(rows,name){
 let hdrIdx=0,best=0;
 rows.slice(0,12).forEach((r,i)=>{const sc=r.filter(c=>Object.values(HDR).some(re=>re.test(c||''))).length;if(sc>best){best=sc;hdrIdx=i;}});
 rows=repairRows(rows,rows[hdrIdx].length);
 const head=rows[hdrIdx].map(h=>(h||'').trim());
 const find=re=>head.findIndex(h=>re.test(h)&&!HDR.balance.test(h));
 const map={date:find(HDR.date),desc:find(HDR.desc),debit:find(HDR.debit),credit:find(HDR.credit),amount:find(HDR.amount)};
 if(map.date<0)map.date=head.findIndex((h,i)=>parseDate(rows[hdrIdx+1]?.[i]));
 if(map.desc<0){let lo=-1,len=0;(rows[hdrIdx+1]||[]).forEach((c,i)=>{if(String(c).length>len&&isNaN(num(c))){len=String(c).length;lo=i;}});map.desc=lo;}
 const sample=rows.slice(hdrIdx+1,hdrIdx+13).filter(r=>r.length>1);
 const numeric=i=>{if(i<0)return false;let ok=0,any=0;
  sample.forEach(r=>{const v=(r[i]||'').trim();if(!v)return;any++;
   if(NUMCELL(v)&&!isNaN(num(v)))ok++;});
  return any?ok/any>=0.6:false;};
 ['debit','credit','amount'].forEach(f=>{if(map[f]>=0&&!numeric(map[f]))map[f]=-1;});
 if(map.amount<0&&map.debit<0&&map.credit<0){
  const cands=head.map((x,i)=>i).filter(i=>i!==map.date&&i!==map.desc&&numeric(i)&&!HDR.balance.test(head[i]||''));
  map.amount=cands.length?cands[0]:-1;
  if(map.amount<0){const all=head.map((x,i)=>i).filter(i=>i!==map.date&&i!==map.desc&&numeric(i));map.amount=all.length?all[0]:-1;}}
 IMP={rows,hdrIdx,map,fmt:'auto',name:name||'pasted'};render();
}
function doImport(){
 const body=IMP.rows.slice(IMP.hdrIdx+1);let added=0,dupe=0;
 /* count what is already stored, so a genuine repeat in the same statement still comes in
    while re-importing the same file is still skipped */
 const have={};
 S.txns.filter(x=>!x.manual).forEach(x=>{const k=hashTx(x);have[k]=(have[k]||0)+1;});
 let early=0;
 body.forEach(r=>{const t=parseRow(r,IMP.map);if(!t)return;
  if(beforeStart(t.date)){early++;return;}
  const k=hashTx(t);
  if(have[k]){have[k]--;dupe++;return;}
  S.txns.push(t);added++;});
 S.txns.sort((a,b)=>a.date.localeCompare(b.date));
 logIt(`Imported ${added} transaction${added===1?'':'s'} from ${IMP.name}${dupe?` (${dupe} already on file)`:''}${early?` · ignored ${early} dated before ${startLabel()}`:''}`);
 IMP=null;persist();view='spend';F.m=S.txns.length?S.txns[S.txns.length-1].date.slice(0,7):'';render();
 toast(`${added} imported${dupe?`, ${dupe} duplicates skipped`:''}`);
}

const ROPS=[['contains','contains'],['starts','starts with'],['equals','is exactly'],['regex','matches pattern']];
function ruleMatch(r,desc,amount){
 const d=(desc||'').toLowerCase(),t=(r.text||'').trim();
 if(!t)return false;
 let ok=false,tl=t.toLowerCase();
 if(r.op==='starts')ok=d.startsWith(tl);
 else if(r.op==='equals')ok=d.trim()===tl;
 else if(r.op==='regex'){try{ok=new RegExp(t,'i').test(desc||'');}catch(e){ok=false;}}
 else ok=d.includes(tl);
 if(!ok)return false;
 if(r.dir==='out'&&!(amount<0))return false;
 if(r.dir==='in'&&!(amount>0))return false;
 if(r.min&&Math.abs(amount)<+r.min)return false;
 if(r.max&&Math.abs(amount)>+r.max)return false;
 return true;
}

/* Changing a category touches that one transaction and nothing else. Anything broader is a
   rule, which you write yourself and preview before it applies. */
function setCat(id,newCat){
 const t=S.txns.find(x=>x.id===id);if(!t)return;
 if(!S.cats.some(c=>c.id===newCat))return toast('That category no longer exists');
 const ty=cat(newCat).type,was=t.amount;
 t.cat=newCat;
 /* the category decides which way the money went: mark something as income and it becomes
    money in, mark it as spending or savings and it becomes money out of the account */
 if(ty==='income')t.amount=Math.abs(t.amount);
 else if(ty==='expense'||ty==='save')t.amount=-Math.abs(t.amount);
 const flipped=Math.sign(was)!==Math.sign(t.amount);
 logIt(`Recategorised “${t.desc}” to ${catName(newCat)}${flipped?` (now counted as money ${t.amount>0?'in':'out'})`:''}`);
 persist();render();
 const key=merchantKey(t.desc);
 const others=key?S.txns.filter(x=>x.id!==t.id&&x.cat!==newCat&&merchantKey(x.desc)===key).length:0;
 toast(flipped
  ? `Moved to ${catName(newCat)} · now counted as money ${t.amount>0?'in':'out'}`
  : others?`Moved to ${catName(newCat)} · ${others} other similar row${others>1?'s':''} left alone — make a rule to catch them`
  :`Moved to ${catName(newCat)}`);
}

function txModal(id){

 <div class="grid2"><label><div class="lbl" style="margin-bottom:6px">Date</div><input class="inp" type="date" id="mdate" value="${ex?ex.date:today()}" style="width:100%"></label>
 <label><div class="lbl" style="margin-bottom:6px">Amount (PKR)</div><input class="inp num" type="text" data-money id="mamt" value="${ex?Math.abs(ex.amount):''}" placeholder="2500" style="width:100%"></label></div>
 <label style="display:block;margin-top:12px"><div class="lbl" style="margin-bottom:6px">Description</div><input class="inp" id="mdesc" value="${ex?esc(ex.desc):''}" placeholder="Imtiaz Super Market" style="width:100%"></label>
 <div class="grid2" style="margin-top:12px"><label><div class="lbl" style="margin-bottom:6px">Direction</div><select class="inp" id="mdir" style="width:100%"><option value="-1" ${ex&&ex.amount<0?'selected':''}>Money out</option><option value="1" ${ex&&ex.amount>0?'selected':''}>Money in</option></select></label>
 <label><div class="lbl" style="margin-bottom:6px">Category</div><select class="inp" id="mcat" style="width:100%">${catOptions(ex?ex.cat:'misc')}</select></label></div>
 <div style="display:flex;gap:10px;margin-top:20px"><button class="btn blue" id="msave">${ex?'Save changes':'Add transaction'}</button>
 ${ex?'<button class="btn sec" id="mdel" style="color:var(--red)">Delete</button>':''}<button class="btn sec" id="mcancel">Cancel</button></div>
 <p class="tip" style="margin-top:14px">Entries you add by hand carry a star and are never matched against or replaced by an imported statement.</p>`);
 $('#mdesc').oninput=()=>{const g=guessCat($('#mdesc').value,+$('#mdir').value);$('#mcat').value=g;syncDir();};
 function syncDir(){
  const ty=cat($('#mcat').value).type;

  else if(ty==='save')$('#mdir').value='-1';
 }
 $('#mcat').onchange=syncDir;

  const ty=cat($('#mcat').value).type;

   toast('Income categories record money coming in — pick an expense category for money going out');
 };
 syncDir();
 $('#mcancel').onclick=closeModal;

  if(ex)Object.assign(ex,o);else S.txns.push({id:uid(),...o,src:'manual',manual:true});

}

  add(2,'HOUSE RENT PAYMENT LANDLORD',-95000);

  add(4,'K-ELECTRIC BILL PAYMENT',-Math.round(R(m>=4&&m<=9?26000:11000,m>=4&&m<=9?52000:19000)/100)*100);
  add(5,'SNGPL GAS BILL',-Math.round(R(1800,9500)/100)*100);
  add(5,'PTCL STORMFIBER INTERNET',-4999);
  add(7,'JAZZ EASYLOAD TOP UP',-Math.round(R(500,2500)/100)*100);
  add(2,'BEACONHOUSE SCHOOL FEE',-46500);

 /* Quick-add from an iOS Shortcut, an Action Button, or Back Tap / Triple Back Tap
    routed to a Shortcut (see README): oasisledger://add?amount=250&desc=Chai&cat=Chai%20%26%20coffee&type=expense&note=KFC
    Runs the exact same push + persist + render as adding a transaction by hand,
    so the budget/home/reports views are correct the moment you next look at them —
    nothing to save, nothing to refresh. */
 function quickAddFromURL(raw){
  try{
   const u=new URL(raw);
   if(!/add/i.test(u.hostname+u.pathname))return;
   const p=u.searchParams;
   const amt=Math.abs(parseFloat(p.get('amount')||p.get('amt')||'0'));
   if(!amt)return;
   const desc=(p.get('desc')||p.get('description')||'Quick add').slice(0,120);
   const note=(p.get('note')||'').slice(0,120);
   const raw2=(p.get('cat')||'').trim().toLowerCase();
   const found=raw2?C.find(c=>c.id.toLowerCase()===raw2||c.name.toLowerCase()===raw2):null;
   const c2=found?found.id:'misc';
   const explicit=(p.get('type')||'').toLowerCase();
   const dir=explicit==='income'?1:explicit==='expense'?-1:(cat(c2).type==='income'?1:-1);
   const o={id:uid(),date:today(),desc,amount:amt*dir,cat:c2,src:'shortcut',manual:true};
   if(note)o.note=note;
   S.txns.push(o);
   S.txns.sort((a,b)=>a.date.localeCompare(b.date));
   persist();render();toast('Added '+desc+' · '+fmt(amt));
  }catch(e){}
 }
 try{
  const App=window.Capacitor.Plugins.App;
  App.addListener('appUrlOpen',(data)=>quickAddFromURL(data.url));
  App.getLaunchUrl().then((r)=>{if(r&&r.url)quickAddFromURL(r.url);}).catch(()=>{});
 }catch(e){}
}
